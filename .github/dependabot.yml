# Dependabot version updates. PRs opened by Dependabot trigger the
# ci-* and dev-image-* workflows via their pull_request triggers.
#
# target-branch is develop for every ecosystem. Without it Dependabot opens
# against the default branch, which is main - and this repository squash-merges
# everything, so a bump that lands on main is never an ancestor of develop and
# has to be re-synced by hand. That is how main accumulated fifteen commits
# develop did not have: #184 had to absorb twelve of them, and #186 had to
# chase the mermaid bump that landed the day after. Bumps now flow through
# develop and reach main with the next promotion.
#
# Dependabot reads this file from the default branch, so these settings only
# take effect once this change reaches main.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /operators/agent
      - /operators/event-gateway
      - /services/chat-mcp
      - /services/hub
      - /services/mcp
      - /services/webhook-receiver
      - /shared/api
      - /shared/auth/oidc
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: docker
    directories:
      - /frontend
      - /operators/agent
      - /operators/event-gateway
      - /pi
      - /services/chat-mcp
      - /services/hub
      - /services/mcp
      - /services/webhook-receiver
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: ci(deps)
