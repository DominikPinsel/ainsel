name: Dev Image - frontend

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/dev-image-frontend.yml'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/dev-image-frontend.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the built image to Docker Hub (default: build only)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compute image metadata
        id: meta
        run: |
          short_sha=$(echo ${GITHUB_SHA} | head -c 7)
          # Publishing is decided once, here, instead of being re-derived from
          # github.event_name at every step. A PR never publishes; a manual
          # dispatch publishes only if it was told to. Before this, a dispatch
          # from any feature branch pushed a :<short-sha> tag that no review
          # had ever looked at.
          publish=true
          case "$GITHUB_EVENT_NAME" in
            pull_request) publish=false ;;
            workflow_dispatch) publish='${{ inputs.publish }}' ;;
          esac
          if [ "$publish" != "true" ]; then publish=false; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          {
            echo "short_sha=${short_sha}"
            echo "tags<<EOF"
            echo "dpinsel/ainsel-hub-frontend:${short_sha}"
            if [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
              echo "dpinsel/ainsel-hub-frontend:dev"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: ${{ steps.meta.outputs.publish == 'true' }}
          load: ${{ steps.meta.outputs.publish != 'true' }}
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
