name: Dev Image - pi

on:
  push:
    branches: [main]
    paths:
      - 'pi/**'
      - '.github/workflows/dev-image-pi.yml'
  workflow_dispatch:

concurrency:
  group: dev-image-pi
  cancel-in-progress: true

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute image metadata
        id: meta
        run: echo "short_sha=$(echo ${GITHUB_SHA} | head -c 7)" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- Base image (ainsel-pi) -----------------------------------
      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: pi
          file: pi/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            TOOLS_TAG=main
          tags: |
            dpinsel/ainsel-pi:dev
            dpinsel/ainsel-pi:${{ steps.meta.outputs.short_sha }}

      # ---------- Go variant (ainsel-pi-go:1.24) ---------------------------
      - name: Build and push Go variant
        uses: docker/build-push-action@v6
        with:
          context: pi
          file: pi/Dockerfile.go
          push: true
          provenance: false
          sbom: false
          build-args: |
            BASE_TAG=dev
          tags: |
            dpinsel/ainsel-pi-go:1.24
            dpinsel/ainsel-pi-go:1.24-${{ steps.meta.outputs.short_sha }}

      # ---------- .NET MAUI variant (ainsel-pi-maui:8.0) -------------------
      - name: Build and push .NET MAUI variant
        uses: docker/build-push-action@v6
        with:
          context: pi
          file: pi/Dockerfile.maui
          push: true
          provenance: false
          sbom: false
          build-args: |
            BASE_TAG=dev
          tags: |
            dpinsel/ainsel-pi-maui:8.0
            dpinsel/ainsel-pi-maui:8.0-${{ steps.meta.outputs.short_sha }}
