name: Dev Image - pi

on:
  push:
    branches: [main, develop]
    paths:
      - 'pi/**'
      - '.github/workflows/dev-image-pi.yml'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
    paths:
      - 'pi/**'
      - '.github/workflows/dev-image-pi.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compute image metadata
        id: meta
        run: |
          short_sha=$(echo ${GITHUB_SHA} | head -c 7)
          {
            echo "short_sha=${short_sha}"
            echo "tags<<EOF"
            echo "dpinsel/ainsel-pi:${short_sha}"
            if [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
              echo "dpinsel/ainsel-pi:dev"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ---------- Base image (ainsel-pi) -----------------------------------
      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: pi
          file: pi/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}

      # ---------- Go variant (ainsel-pi-go:1.24) ---------------------------
      - name: Build and push Go variant
        uses: docker/build-push-action@v7
        with:
          context: pi
          file: pi/Dockerfile.go
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: false
          sbom: false
          build-args: |
            BASE_TAG=dev
          tags: |
            dpinsel/ainsel-pi-go:1.24
            dpinsel/ainsel-pi-go:1.24-${{ steps.meta.outputs.short_sha }}

      # ---------- .NET MAUI variant (ainsel-pi-maui:8.0) -------------------
      - name: Build and push .NET MAUI variant
        uses: docker/build-push-action@v7
        with:
          context: pi
          file: pi/Dockerfile.maui
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: false
          sbom: false
          build-args: |
            BASE_TAG=dev
          tags: |
            dpinsel/ainsel-pi-maui:8.0
            dpinsel/ainsel-pi-maui:8.0-${{ steps.meta.outputs.short_sha }}
