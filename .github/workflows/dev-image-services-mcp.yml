name: Dev Image - services/mcp

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/mcp/**'
      - 'shared/auth/**'
      - 'go.work'
      - '.github/workflows/dev-image-services-mcp.yml'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
    paths:
      - 'services/mcp/**'
      - 'shared/auth/**'
      - 'go.work'
      - '.github/workflows/dev-image-services-mcp.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compute image metadata
        id: meta
        run: |
          short_sha=$(echo ${GITHUB_SHA} | head -c 7)
          {
            echo "short_sha=${short_sha}"
            echo "tags<<EOF"
            echo "dpinsel/ainsel-mcp:${short_sha}"
            if [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
              echo "dpinsel/ainsel-mcp:dev"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/mcp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, steps.meta.outputs.short_sha) || format('{0}-{1}', github.ref_name, steps.meta.outputs.short_sha) }}
            VCS_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
