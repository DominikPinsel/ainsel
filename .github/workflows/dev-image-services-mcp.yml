name: Dev Image - services/mcp

on:
  push:
    branches: [main]
    paths:
      - 'services/mcp/**'
      - 'shared/auth/**'
      - 'go.work'
      - '.github/workflows/dev-image-services-mcp.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'services/mcp/**'
      - 'shared/auth/**'
      - 'go.work'
      - '.github/workflows/dev-image-services-mcp.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute image metadata
        id: meta
        run: echo "short_sha=$(echo ${GITHUB_SHA} | head -c 7)" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/mcp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, steps.meta.outputs.short_sha) || format('main-{0}', steps.meta.outputs.short_sha) }}
            VCS_REF=${{ github.sha }}
          tags: |
            dpinsel/ainsel-mcp:dev
            dpinsel/ainsel-mcp:${{ steps.meta.outputs.short_sha }}
