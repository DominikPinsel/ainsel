{{- if .Values.networkPolicy.enabled }}
# Default deny all ingress to the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow hub-backend ingress from frontend, mcp, agents, and the ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hub-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: hub-backend
  policyTypes:
    - Ingress
  ingress:
    # From frontend
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: hub-frontend
      ports:
        - port: {{ .Values.hub.port }}
    # From MCP server
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mcp
      ports:
        - port: {{ .Values.hub.port }}
    # From agent pods. Agent pods are created by the agent-operator and are
    # matched via managed-by so the rule works for pods from operator versions
    # with and without the component label.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: agent-operator
      ports:
        - port: {{ .Values.hub.port }}
    # From the ingress controller (browser API traffic: UI -> ingress -> hub-backend)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - port: {{ .Values.hub.port }}
    # Allow metrics scraping
    - ports:
        - port: {{ .Values.hub.metricsPort }}
---
# Allow Postgres ingress from hub only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: hub-backend
      ports:
        - port: 5432
---
# Allow frontend ingress (from ingress controller / external)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hub-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: hub-frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
---
# Allow MCP ingress (from ingress controller / external)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
---
# Allow Qdrant ingress from agents and hub
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: qdrant
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: agent-operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: hub-backend
      ports:
        - port: 6333
        - port: 6334
---
# Agent egress: allow traffic to known cluster services, DNS, and HTTPS (443/TCP).
# The podSelector matches app.kubernetes.io/managed-by: agent-operator rather
# than component: agents so the policy applies to agent pods from all operator
# versions — older operators do not add the component label, and a mismatched
# selector silently leaves agent egress either unfiltered or (when an additive
# extension policy does match) locked down to that policy's allows only.
# TODO(#652): Replace broad 443/TCP egress with FQDN-scoped filtering via the
# sidecar proxy approach tracked in the parent Epic. Standard NetworkPolicy
# cannot express FQDN-based rules; CIDR-pinning is unstable for SaaS LLM APIs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: agent-operator
  policyTypes:
    - Egress
  egress:
    # Qdrant
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: qdrant
      ports:
        - port: 6333
    # Hub backend
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: hub-backend
      ports:
        - port: 8080
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS egress for LLM APIs (ollama.com, opencode.ai, aliyuncs.com, custom providers).
    # TODO(#652): Replace with FQDN-scoped egress via sidecar proxy.
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
