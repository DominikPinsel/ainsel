{{- if and .Values.mcp.enabled .Values.mcp.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ainsel-mcp
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ainsel-mcp
    app.kubernetes.io/component: mcp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /mcp$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- with .Values.mcp.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.mcp.ingress.className }}
  rules:
    - host: {{ .Values.mcp.ingress.host }}
      http:
        paths:
          - path: {{ .Values.mcp.ingress.path }}(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ainsel-mcp
                port:
                  name: http
{{- end }}
