{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ainsel-mcp
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ainsel-mcp
    app.kubernetes.io/component: mcp
  {{- with .Values.mcp.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
