{{- if .Values.mcp.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ainsel-mcp
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ainsel-mcp
subjects:
  - kind: ServiceAccount
    name: ainsel-mcp
    namespace: {{ .Values.namespace }}
{{- end }}
