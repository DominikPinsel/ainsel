{{- if and .Values.mcp.enabled .Values.mcp.ingress.enabled }}
# Serves the RFC 9728 OAuth Protected Resource Metadata endpoint.
#
# Per RFC 9728 §3.2, when the resource server has a path component (e.g. /ainsel-dev/mcp),
# the protected resource metadata URL is placed at the root of the domain:
#   https://{host}/.well-known/oauth-protected-resource{path}
#
# The main MCP ingress only covers {path}/* so a separate ingress with a
# fixed rewrite is needed. Without this, the MCP client's OAuth discovery
# hits a redirect and fails with "Failed to parse JSON".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ainsel-mcp-oauth-protected-resource
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ainsel-mcp
    app.kubernetes.io/component: mcp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /.well-known/oauth-protected-resource
    {{- with .Values.mcp.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.mcp.ingress.className }}
  rules:
    - host: {{ .Values.mcp.ingress.host }}
      http:
        paths:
          - path: /.well-known/oauth-protected-resource{{ .Values.mcp.ingress.path }}
            pathType: Exact
            backend:
              service:
                name: ainsel-mcp
                port:
                  name: http
{{- end }}
