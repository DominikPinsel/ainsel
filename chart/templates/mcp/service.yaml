{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: ainsel-mcp
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ainsel-mcp
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.mcp.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: ainsel-mcp
{{- end }}
