apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-event-source-gateway-operator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-event-source-gateway-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ainsel-k8s-event-source-gateway-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ainsel-k8s-event-source-gateway-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: k8s-event-source-gateway-operator
        {{- with .Values.connectorOperator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.connectorOperator.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: k8s-event-source-gateway-operator
      {{- with .Values.connectorOperator.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.connectorOperator.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.connectorOperator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.connectorOperator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.connectorOperator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.connectorOperator.priorityClassName }}
      priorityClassName: {{ .Values.connectorOperator.priorityClassName }}
      {{- end }}
      containers:
        - name: operator
          image: "{{ .Values.connectorOperator.image.repository }}:{{ .Values.connectorOperator.image.tag }}"
          imagePullPolicy: {{ .Values.connectorOperator.image.pullPolicy }}
          {{- with .Values.connectorOperator.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --leader-elect
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.connectorOperator.hubURL }}
            - name: HUB_URL
              value: {{ .Values.connectorOperator.hubURL | quote }}
            {{- else }}
            - name: HUB_URL
              value: "http://hub-backend.{{ .Values.namespace }}.svc.cluster.local:8080"
            {{- end }}
            {{- if .Values.auth.internalValidateSecret }}
            - name: HUB_INTERNAL_VALIDATE_SECRET
              value: {{ .Values.auth.internalValidateSecret | quote }}
            {{- end }}
            - name: CONNECTOR_IMAGE_PULL_POLICY
              value: {{ .Values.connectorOperator.connectorImagePullPolicy | default "IfNotPresent" | quote }}
            {{- with .Values.connectorOperator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.connectorOperator.resources | nindent 12 }}
          {{- with .Values.connectorOperator.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- with .Values.connectorOperator.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
