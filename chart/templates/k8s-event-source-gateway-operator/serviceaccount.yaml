apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-event-source-gateway-operator
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: k8s-event-source-gateway-operator
  {{- with .Values.connectorOperator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
