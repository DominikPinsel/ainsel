{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) }}
{{- /*
Use lookup to keep the password stable across helm upgrades. On first install
the lookup returns an empty map and randAlphaNum generates a fresh password.
*/}}
{{- $existing := lookup "v1" "Secret" .Values.namespace "ainsel-hub-db" }}
{{- $password := "" }}
{{- if and $existing (hasKey $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- $dsn := printf "postgres://%s:%s@postgres.%s.svc.cluster.local:5432/%s?sslmode=disable" .Values.postgres.username $password .Values.namespace .Values.postgres.database }}
apiVersion: v1
kind: Secret
metadata:
  name: ainsel-hub-db
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  username: {{ .Values.postgres.username }}
  password: {{ $password | quote }}
  database: {{ .Values.postgres.database }}
  dsn: {{ $dsn | quote }}
{{- end }}
