{{- if eq (.Values.auth.mode | default "") "local" }}
{{- /*
Auto-generated secrets for auth.mode=local, kept stable across upgrades via
lookup (same pattern as the postgres password). Operators can bring their
own via auth.local.adminPasswordSecret / auth.local.jwtSecretSecret.
NOTE: `and` in Go templates evaluates ALL arguments eagerly (no
short-circuit), so `.data` must be guarded with `default dict`.
*/}}
{{- if not .Values.auth.local.adminPasswordSecret }}
{{- $existing := lookup "v1" "Secret" .Values.namespace "ainsel-local-admin" }}
{{- $password := "" }}
{{- if and $existing (hasKey ($existing.data | default dict) "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 20 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: ainsel-local-admin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-backend
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
{{- if not .Values.auth.local.jwtSecretSecret }}
---
{{- $existingJwt := lookup "v1" "Secret" .Values.namespace "ainsel-local-jwt" }}
{{- $jwt := "" }}
{{- if and $existingJwt (hasKey ($existingJwt.data | default dict) "secret") }}
{{- $jwt = index $existingJwt.data "secret" | b64dec }}
{{- else }}
{{- $jwt = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: ainsel-local-jwt
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-backend
type: Opaque
stringData:
  secret: {{ $jwt | quote }}
{{- end }}
{{- end }}
