apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hub-backend
subjects:
  - kind: ServiceAccount
    name: hub-backend
    namespace: {{ .Values.namespace }}
