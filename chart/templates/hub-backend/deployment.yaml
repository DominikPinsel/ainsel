apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-backend
spec:
  replicas: {{ .Values.hub.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ainsel-hub-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ainsel-hub-backend
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: hub-backend
        {{- with .Values.hub.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.hub.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: hub-backend
      enableServiceLinks: false
      {{- with .Values.hub.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hub.priorityClassName }}
      priorityClassName: {{ .Values.hub.priorityClassName }}
      {{- end }}
      initContainers:
        - name: wait-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                if pg_isready -h postgres.{{ .Values.namespace }}.svc.cluster.local -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
                  exit 0
                fi
                echo "waiting for postgres (attempt $i/60)..."
                sleep 2
              done
              echo "postgres did not become ready within 2 minutes"
              exit 1
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.existingSecret | default "ainsel-hub-db" }}
                  key: username
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.existingSecret | default "ainsel-hub-db" }}
                  key: database
      containers:
        - name: hub-backend
          image: "{{ .Values.hub.image.repository }}:{{ .Values.hub.image.tag }}"
          imagePullPolicy: {{ .Values.hub.image.pullPolicy }}
          {{- with .Values.hub.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.hub.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.hub.metricsPort }}
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HUB_NAMESPACE
              value: {{ .Values.hub.namespace | default .Values.namespace | quote }}
            - name: HUB_PORT
              value: "{{ .Values.hub.port }}"
            - name: HUB_METRICS_PORT
              value: "{{ .Values.hub.metricsPort }}"
            - name: PLATFORM_EXTERNAL_URL
              value: {{ .Values.hub.platformExternalUrl | quote }}
            - name: CONNECTOR_IMAGE_WEBHOOK
              value: "{{ .Values.hub.connectorImages.webhook.repository }}:{{ .Values.hub.connectorImages.webhook.tag }}"
            {{- if .Values.observability.prometheus.url }}
            - name: HUB_PROMETHEUS_URL
              value: {{ .Values.observability.prometheus.url | quote }}
            {{- end }}
            - name: HUB_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.existingSecret | default "ainsel-hub-db" }}
                  key: dsn
            {{- if .Values.auth.oidcIssuer }}
            - name: ZITADEL_ISSUER
              value: {{ .Values.auth.oidcIssuer | quote }}
            {{- end }}
            {{- if .Values.auth.oidcProjectId }}
            - name: OIDC_PROJECT_ID
              value: {{ .Values.auth.oidcProjectId | quote }}
            {{- end }}
            {{- if and .Values.auth.allowInsecureNoAuth (not .Values.auth.oidcIssuer) }}
            - name: HUB_ALLOW_INSECURE_NO_AUTH
              value: "true"
            {{- end }}
            {{- if .Values.auth.internalValidateSecret }}
            - name: HUB_INTERNAL_VALIDATE_SECRET
              value: {{ .Values.auth.internalValidateSecret | quote }}
            {{- end }}
            {{- with .Values.hub.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
          {{- with .Values.hub.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- with .Values.hub.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
