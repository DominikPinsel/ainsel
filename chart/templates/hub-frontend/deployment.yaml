{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ainsel-hub-frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ainsel-hub-frontend
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: hub-frontend
        {{- with .Values.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.ui.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.ui.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.ui.priorityClassName }}
      priorityClassName: {{ .Values.ui.priorityClassName }}
      {{- end }}
      containers:
        - name: hub-frontend
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          {{- with .Values.ui.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: BACKEND_HOST
              value: hub-backend.{{ .Values.namespace }}.svc.cluster.local
            - name: BASE_PATH
              value: {{ .Values.ui.basePath | default "" | quote }}
            {{- if .Values.auth.oidcIssuer }}
            - name: OIDC_ISSUER
              value: {{ .Values.auth.oidcIssuer | quote }}
            {{- end }}
            {{- if .Values.auth.oidcClientId }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.auth.oidcClientId | quote }}
            {{- end }}
            {{- if .Values.auth.oidcProjectId }}
            - name: OIDC_PROJECT_ID
              value: {{ .Values.auth.oidcProjectId | quote }}
            {{- end }}
            {{- if .Values.forgejo.apiBase }}
            - name: FORGEJO_API_BASE
              value: {{ .Values.forgejo.apiBase | quote }}
            {{- end }}
            {{- if .Values.forgejo.repo }}
            - name: FORGEJO_REPO
              value: {{ .Values.forgejo.repo | quote }}
            {{- end }}
            {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          {{- with .Values.ui.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
      {{- with .Values.ui.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
