{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: hub-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: ainsel-hub-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
