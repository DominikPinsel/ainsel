{{- if .Values.kubernetesMcp.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-server
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: kubernetes-mcp-server
    app.kubernetes.io/component: kubernetes-mcp
automountServiceAccountToken: true # required: upstream uses the in-cluster client config
{{- end }}