{{- if .Values.kubernetesMcp.enabled }}
{{- if .Values.kubernetesMcp.access.clusterScope }}
# Cluster-wide read-only (access.clusterScope=true) — supersedes
# access.namespaces: one ClusterRoleBinding to the built-in `view`
# ClusterRole. The built-in view role grants get/list/watch on namespaced
# resources (Secrets excluded) and on cluster-scoped ones (nodes, ns).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-server-view
  labels:
    app.kubernetes.io/name: kubernetes-mcp-server
    app.kubernetes.io/component: kubernetes-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-server
    namespace: {{ $.Values.namespace }}
{{- else }}
# Namespace-scoped read-only access: RoleBinding to the built-in `view`
# ClusterRole in every target namespace. The built-in view role grants
# get/list/watch on all namespaced resources except Secrets. Agents cannot
# see or touch resources outside these namespaces; cluster-scoped objects
# (namespaces list, nodes) are denied.
{{- $namespaces := .Values.kubernetesMcp.access.namespaces }}
{{- if empty $namespaces }}
{{- $namespaces = list .Values.namespace }}
{{- end }}
{{- range $i, $ns := $namespaces }}
{{- if $i }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-mcp-server-view
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: kubernetes-mcp-server
    app.kubernetes.io/component: kubernetes-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-server
    namespace: {{ $.Values.namespace }}
{{- end }}
{{- end }}
{{- end }}