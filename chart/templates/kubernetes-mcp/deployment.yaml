{{- if .Values.kubernetesMcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-server
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: kubernetes-mcp-server
    app.kubernetes.io/component: kubernetes-mcp
spec:
  replicas: {{ .Values.kubernetesMcp.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-mcp-server
        app.kubernetes.io/component: kubernetes-mcp
        {{- with .Values.kubernetesMcp.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/kubernetes-mcp/configmap.yaml") . | sha256sum }}
        {{- with .Values.kubernetesMcp.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: kubernetes-mcp-server
      automountServiceAccountToken: true # required: upstream uses the in-cluster client config
      {{- with .Values.kubernetesMcp.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kubernetesMcp.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kubernetesMcp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kubernetesMcp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kubernetesMcp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.kubernetesMcp.priorityClassName }}
      priorityClassName: {{ .Values.kubernetesMcp.priorityClassName }}
      {{- end }}
      containers:
        - name: kubernetes-mcp-server
          image: "{{ .Values.kubernetesMcp.image.repository }}:{{ .Values.kubernetesMcp.image.tag }}"
          imagePullPolicy: {{ .Values.kubernetesMcp.image.pullPolicy }}
          {{- with .Values.kubernetesMcp.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "--config"
            - "/etc/kubernetes-mcp-server/config.toml"
          ports:
            - name: http
              containerPort: {{ .Values.kubernetesMcp.port }}
          env:
            {{- with .Values.kubernetesMcp.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.kubernetesMcp.resources | nindent 12 }}
          {{- with .Values.kubernetesMcp.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.kubernetesMcp.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}