{{- if .Values.kubernetesMcp.enabled }}
# Service name follows the discovery contract of the agent operator:
# "mcp-" + MCP registry name, port named `http` (see
# operators/agent/internal/controller/mcpservers/discover.go). Agents list
# the registry name in Agent.spec.enabledMCPs and receive
# http://mcp-<name>.<ns>.svc.cluster.local:8080/mcp as MCP_SERVERS entry.
apiVersion: v1
kind: Service
metadata:
  name: mcp-{{ .Values.kubernetesMcp.registryName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: kubernetes-mcp-server
    app.kubernetes.io/component: kubernetes-mcp
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.kubernetesMcp.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: kubernetes-mcp-server
{{- end }}