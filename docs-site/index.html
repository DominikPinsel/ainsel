<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Same theme bootstrap as the frontend: honour the stored app theme,
         fall back to the OS preference, and avoid a flash of wrong theme. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ainsel-theme')
          var isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <title>AInsel Docs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
