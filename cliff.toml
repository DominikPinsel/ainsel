# git-cliff configuration for the AInsel monorepo.
#
# Per-component release workflows use git-cliff with
# `--include-path <component>/**` and `--tag-pattern <component>/v[0-9]*`
# to scope changelog generation. Auto-versioning via release-please
# pattern is driven by the per-component release workflows.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}

"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^chore", group = "Miscellaneous", skip = true },
    { message = "^ci",    group = "Miscellaneous", skip = true },
]
tag_pattern = "v[0-9]*"
